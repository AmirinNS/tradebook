{% extends "base.html" %}
{% block title %}Log in · {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-5 col-lg-4">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" maxlength="254" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" maxlength="1024" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="small mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a>.</p>
    </div>
</div>
{% endblock %}
