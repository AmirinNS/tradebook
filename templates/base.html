<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}tradebook{% endblock %}</title>

    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var urlTheme = params.get('theme');
                var stored = urlTheme || localStorage.getItem('theme');
                if (stored === 'dark' || stored === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', stored);
                }
            } catch (e) {}
        })();
    </script>

    <!-- SEO -->
    <meta name="description" content="{% block meta_description %}{{ meta_description }}{% endblock %}">
    <meta name="robots" content="{% block meta_robots %}index,follow{% endblock %}">
    <link rel="canonical" href="{{ canonical_url }}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:image" content="{% block og_image %}{{ meta_image }}{% endblock %}">
    <meta property="og:url" content="{{ canonical_url }}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.title() }}">
    <meta name="twitter:description" content="{{ self.meta_description() }}">
    <meta name="twitter:image" content="{{ self.og_image() }}">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">

    <!-- Fonts: IBM Plex Sans & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <a class="tb-skip" href="#main">Skip to content</a>

    {% include "_navbar.html" %}

    <main id="main" class="container-xxl px-3 px-lg-4 py-4 flex-grow-1" style="max-width:1280px; width:100%; min-width:0;">
        {% include "_flash.html" %}
        {% block content %}{% endblock %}
    </main>

    {% include "_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
