{% extends "base.html" %}
{% block title %}Register · {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-5 col-lg-4">
        <h1 class="h4 mb-3">Register</h1>
        <form method="post" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" maxlength="254" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="8" maxlength="1024" autocomplete="new-password" aria-describedby="password-help" required>
                <div id="password-help" class="form-text">Use at least 8 characters.</div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>
        <p class="small mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
    </div>
</div>
{% endblock %}
